<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit AI">
<meta name="theme-color" content="#0a0c13">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Orbit AI</title>
<style>
:root{--coral:#ff6f61;--teal:#19d3c5;--violet:#7c6cff}
html[data-theme=dark]{--bg:#0a0c13;--glass:rgba(10,12,19,.55);--surface:rgba(255,255,255,.055);--surface2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--text:#edf0f8;--dim:#98a2b8;--ub:rgba(255,255,255,.09);--sheet:#131725;--aur:.34;color-scheme:dark}
html[data-theme=light]{--bg:#f4f6fb;--glass:rgba(244,246,251,.6);--surface:rgba(255,255,255,.72);--surface2:rgba(20,30,60,.07);--line:rgba(20,30,60,.12);--text:#151a2c;--dim:#667088;--ub:rgba(255,255,255,.9);--sheet:#fff;--aur:.26;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--aur);will-change:transform}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--coral),transparent 65%);animation:d1 22s ease-in-out infinite alternate}
.b2{width:75vmax;height:75vmax;right:-30vmax;bottom:-35vmax;background:radial-gradient(circle,var(--teal),transparent 65%);animation:d2 26s ease-in-out infinite alternate}
.b3{width:55vmax;height:55vmax;left:25vw;top:30vh;background:radial-gradient(circle,var(--violet),transparent 65%);opacity:calc(var(--aur)*.55);animation:d3 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(20vmax,16vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-18vmax,-14vmax) scale(1.1)}}
@keyframes d3{to{transform:translate(-14vmax,10vmax) scale(1.25)}}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:var(--text);flex:none}
.ib:active{background:var(--surface2)}
.hc{display:flex;align-items:center;gap:10px;min-width:0}
.hc .logo{width:30px;height:30px}
.pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;max-width:52vw;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .i{width:14px;height:14px}

/* logo */
.logo{display:block;width:100%;height:100%;overflow:visible}
.logo .spin{transform-origin:50px 50px}
.logo .star{transform-origin:50px 50px}
.logo.live .s1,.msg.streaming .logo .s1{animation:spin 14s linear infinite}
.logo.live .s2,.msg.streaming .logo .s2{animation:spin 20s linear infinite reverse}
.logo.live .s3,.msg.streaming .logo .s3{animation:spin 9s linear infinite}
.logo.live .star,.msg.streaming .logo .star{animation:pulse 2.4s ease-in-out infinite}
.logo.live,.msg.streaming .logo{filter:drop-shadow(0 0 6px rgba(255,111,97,.35)) drop-shadow(0 0 10px rgba(25,211,197,.3))}
body.busy .hc .logo .s1{animation-duration:4s}
body.busy .hc .logo .s2{animation-duration:6s}
body.busy .hc .logo .s3{animation-duration:3s}
body.busy .hc .logo .star{animation-duration:.8s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.82);opacity:.85}50%{transform:scale(1.2);opacity:1}}
.gt{background:linear-gradient(90deg,var(--coral),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:650}

/* chat */
#chat{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px 30px;animation:rise .5s ease both}
.welcome .big{width:150px;height:150px;margin-bottom:8px}
.welcome h1{margin:6px 0 6px;font-size:28px;letter-spacing:-.3px}
.welcome p{margin:0 0 22px;color:var(--dim);font-size:15.5px}
.sugs{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px}
.sug{padding:13px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;text-align:left;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sug:active{background:var(--surface2)}
.msg{display:flex;gap:11px;margin:0 auto 20px;max-width:780px;width:100%;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.msg.static{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .col{display:flex;flex-direction:column;align-items:flex-end;max-width:88%}
.msg.user .body{background:var(--ub);border:1px solid var(--line);border-radius:20px 20px 6px 20px;padding:11px 15px;line-height:1.45;font-size:15.5px;word-break:break-word;overflow-wrap:anywhere}
.msg.ai .av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--line);padding:3px;margin-top:1px}
.msg.ai .body{flex:1;min-width:0}
.who{font-size:12.5px;color:var(--dim);margin:0 0 5px;display:flex;gap:6px;align-items:center}
.content{font-size:15.5px;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
.content>*:first-child{margin-top:0}
.content p{margin:0 0 .75em}
.content h1,.content h2,.content h3,.content h4{margin:1em 0 .4em;line-height:1.25}
.content h1{font-size:1.35em}.content h2{font-size:1.2em}.content h3,.content h4{font-size:1.05em}
.content ul,.content ol{margin:.2em 0 .8em;padding-left:1.3em}
.content li{margin:.2em 0}
.content a{color:var(--teal);text-decoration:underline;text-underline-offset:2px}
.content blockquote{margin:.6em 0;padding:.2em 0 .2em 14px;border-left:3px solid var(--coral);color:var(--dim)}
.content hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--surface2);padding:2px 6px;border-radius:6px}
.tw{overflow-x:auto;margin:.6em 0}
.content table{border-collapse:collapse;font-size:.93em;min-width:60%}
.content th,.content td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.content th{background:var(--surface2)}
.cb{margin:.7em 0;border-radius:14px;overflow:hidden;background:#0c1020;border:1px solid rgba(255,255,255,.1)}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:rgba(255,255,255,.06);font-size:12px;color:#a8b2c8}
.cc{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;color:#c9d2e6;font-size:12px}
.cc:active{background:rgba(255,255,255,.12)}
.cc .i{width:14px;height:14px}
.cb pre{margin:0;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cb code{background:none;padding:0;color:#e4e9f5;font-size:13px;line-height:1.55;white-space:pre}
.tk-c{color:#74809c;font-style:italic}.tk-s{color:#7ee0b3}.tk-n{color:#ffa07a}.tk-k{color:#c4a0ff}
.tk-l{color:#ffa07a}.tk-f{color:#7cc4ff}.tk-t{color:#ffd479}
.err{margin-top:8px;padding:10px 13px;border-radius:12px;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);color:#ff9d9d;font-size:14px;line-height:1.4}
html[data-theme=light] .err{color:#c23535}
.acts{display:flex;gap:2px;margin-top:6px;opacity:.75}
.acts button{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;color:var(--dim);font-size:12.5px}
.acts button:active{background:var(--surface2)}
.acts .i{width:16px;height:16px}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--teal));animation:tp 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,70%,100%{transform:translateY(0) scale(.8);opacity:.5}35%{transform:translateY(-6px) scale(1.1);opacity:1}}
.edit-ta{width:min(80vw,560px);min-height:80px;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;outline:0}
.edit-b{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* composer */
.composer{flex:none;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
.cbar{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:7px;border-radius:26px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.cbar:focus-within{border-color:rgba(25,211,197,.5);box-shadow:0 0 0 4px rgba(25,211,197,.08)}
#inp{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:9px 0;max-height:150px;min-height:38px}
#inp::placeholder{color:var(--dim)}
.sendb{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--coral),var(--teal));box-shadow:0 4px 16px rgba(255,111,97,.3);transition:transform .15s,opacity .15s}
.sendb:active{transform:scale(.92)}
.sendb.dis{opacity:.45}
.sendb .i{stroke-width:2.2}
.foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:6px}

/* вложения */
.addb{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--dim);margin-bottom:2px}
.addb:active{background:var(--surface2)}
.addb .i{width:22px;height:22px}
.atts{max-width:780px;margin:0 auto 8px;display:flex;gap:8px;overflow-x:auto;padding:2px}
.atts:empty{display:none}
.att{position:relative;flex:none;height:64px;max-width:210px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 30px 0 10px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.att.img{width:64px;padding:0;overflow:hidden}
.att.img img{width:100%;height:100%;object-fit:cover;display:block}
.att .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.matts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
.matts img{max-width:220px;max-height:220px;border-radius:14px;border:1px solid var(--line);display:block}
.mfile{padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drawer */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:21;background:var(--sheet);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
body.open #scrim{opacity:1;pointer-events:auto}
body.open #drawer{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:4px 6px 12px}
.dh .logo{width:34px;height:34px}
.dh b{flex:1;font-size:19px;letter-spacing:.2px}
.newchat{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--coral),var(--teal));margin-bottom:10px}
.sbox{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--surface2);margin-bottom:8px}
.sbox input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:10px 0;min-width:0}
.sbox .i{color:var(--dim);width:18px;height:18px}
#list{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.it{display:flex;align-items:center;border-radius:12px;padding-left:12px}
.it.on{background:var(--surface2)}
.it .o{flex:1;min-width:0;text-align:left;padding:10px 0}
.it .o b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .o small{color:var(--dim);font-size:12px}
.it .dots{width:38px;height:38px;display:grid;place-items:center;color:var(--dim)}
.empty{color:var(--dim);font-size:14px;padding:14px 10px}
.dfoot{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.dfoot button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:12px;font-size:15px}
.dfoot button:active{background:var(--surface2)}

/* sheets */
#layer{position:relative;z-index:60}
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .2s both}
.ov.out{animation:fadeout .18s both}
.ov.out .sheet{animation:down .18s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.sheet h3{margin:0 0 14px;font-size:19px}
.sheet label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
.sheet .dim{color:var(--dim);font-size:14.5px;margin:0 0 12px}
.fi{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:0}
.fi:focus{border-color:rgba(25,211,197,.6)}
textarea.fi{resize:vertical;min-height:90px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.4}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);text-align:center;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{border:0;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--coral),var(--teal))}
.btn.d{color:#ff8a8a}
.btn.wide{width:100%;margin-top:10px;flex:none}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);gap:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--sheet);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.25)}
.mrow{display:flex;align-items:center;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;padding-left:12px;background:var(--surface)}
.mrow.on{border-color:rgba(25,211,197,.6);background:rgba(25,211,197,.08)}
.msel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 0}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--dim);flex:none}
.mrow.on .rd{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.mt{min-width:0}.mt b{display:block;font-weight:600;font-size:15px}.mt small{display:block;color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.chip:active{background:var(--surface)}
.cm{display:flex;align-items:center;gap:12px;width:100%;padding:14px 8px;border-radius:12px;font-size:16px}
.cm:active{background:var(--surface2)}
.cm.d{color:#ff8a8a}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);z-index:90;padding:10px 16px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);font-size:14px;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}.aurora i{animation:none!important}}
</style>
</head>
<body>
<div class="aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="app">
  <header>
    <button class="ib" id="menu" aria-label="История"></button>
    <div class="hc"><span id="hlogo" style="width:30px;height:30px;display:block"></span><button class="pill" id="pill"><span id="mname"></span></button></div>
    <button class="ib" id="newbtn" aria-label="Новый чат"></button>
  </header>
  <main id="chat"></main>
  <div class="composer">
    <div class="atts" id="atts"></div>
    <div class="cbar">
      <button class="addb" id="addb" aria-label="Добавить фото или файл"></button>
      <textarea id="inp" rows="1" placeholder="Напишите сообщение…"></textarea>
      <button class="sendb dis" id="send" aria-label="Отправить"></button>
    </div>
    <div class="foot">Orbit может ошибаться. Проверяйте важное.</div>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dh"><span id="dlogo" style="width:34px;height:34px;display:block"></span><b class="gt">Orbit AI</b><button class="ib" id="themebtn" aria-label="Тема"></button></div>
  <button class="newchat" id="d-new"></button>
  <div class="sbox"><span id="sicon"></span><input id="search" type="search" placeholder="Поиск по чатам" autocomplete="off"></div>
  <div id="list"></div>
  <div class="dfoot">
    <button id="d-models"></button>
    <button id="d-settings"></button>
  </div>
</aside>
<div id="toast"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= иконки ================= */
const IC = {
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  newc:'<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12 15.4l-3.7.9.9-3.7z"/>',
  send:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  dots:'<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',

  busy = v; document.body.classList.toggle('busy', v);
  sendBtn.innerHTML = ic(v ? 'stop' : 'send');
  sendBtn.classList.toggle('dis', !v && !inp.value.trim() && !pending.length);

/* ================= генерация ================= */
const endpoint = u => { u = (u || '').trim().replace(/\/+$/, ''); return /\/chat\/completions$/.test(u) ? u : u + '/chat/completions'; };
async function httpError(res){
  let d = '';
  try { const t = await res.text(); try { const j = JSON.parse(t); d = (j.error && (j.error.message || j.error)) || j.message || t; } catch(e){ d = t; } } catch(e){}
  const e = new Error('HTTP ' + res.status); e.status = res.status; e.detail = String(d).slice(0, 240); return e;
}
function friendly(e, mdl){
  if (e.message === 'NOKEY') return 'Для модели «' + mdl.name + '» не указан API ключ. Нажмите на название модели вверху и добавьте ключ.';
  if (e.status === 401 || e.status === 403) return 'Неверный или неподходящий API ключ для «' + mdl.name + '». Проверьте ключ в настройках модели.';
  if (e.status === 404) return 'Сервер не нашёл модель «' + mdl.model + '» или адрес. ' + (e.detail || '');
  if (e.status === 429) return 'Слишком много запросов или закончился лимит. Подождите и повторите. ' + (e.detail || '');
  if (e.status) return 'Ошибка сервера (' + e.status + '). ' + (e.detail || '');
  if (e.name === 'TypeError') return 'Нет соединения с сервером, либо он не разрешает запросы из браузера (CORS).';
  return e.message || 'Неизвестная ошибка';
}
function generate(c){
  genPromise = (async () => {
    const mdl = activeModel();
    const am = { id:uid(), role:'assistant', content:'', t:Date.now(), model:mdl.name, streaming:true };
    c.messages.push(am);
    chatEl.querySelectorAll('[data-act=regen]').forEach(b => b.remove());
    const el = msgEl(am, true); chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    setBusy(true); ctrl = new AbortController();
    let raf = 0;
    const paint = () => { raf = 0; const nb = nearBottom(); fillAssistant(el, am, false); if (nb) chatEl.scrollTop = chatEl.scrollHeight; };
    try {
      if (!mdl.key) throw new Error('NOKEY');
      const hist = c.messages.slice(0, -1).filter(m => (m.content || (m.att && m.att.length)) && !m.error).slice(-Math.max(2, S.ctx | 0)).map(toApi);
      const res = await fetch(endpoint(mdl.url), {
        method:'POST', signal:ctrl.signal,
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + mdl.key },
        body:JSON.stringify({ model:mdl.model, stream:true, messages:[{ role:'system', content:S.system || DEF_SYS }, ...hist] })
      });
      if (!res.ok) throw await httpError(res);
      if ((res.headers.get('content-type') || '').includes('application/json')) {
        const j = await res.json();
        am.content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
        paint();
      } else {
        const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
        while (true) {
          const r = await reader.read(); if (r.done) break;
          buf += dec.decode(r.value, { stream:true });
          const lines = buf.split('\n'); buf = lines.pop();
          for (const l of lines) {
            if (!l.startsWith('data:')) continue;
            const d = l.slice(5).trim(); if (!d || d === '[DONE]') continue;
            try {
              const j = JSON.parse(d);
              const dl = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (dl) { am.content += dl; if (!raf) raf = requestAnimationFrame(paint); }
            } catch(x){}
          }
        }
      }
      if (!am.content.trim()) throw new Error('Пустой ответ от модели.');
    } catch (e) {
      if (e.name === 'AbortError') { if (!am.content) c.messages = c.messages.filter(x => x !== am); }
      else am.error = friendly(e, mdl);
    } finally {
      if (raf) cancelAnimationFrame(raf);
      am.streaming = false; ctrl = null;
      c.updated = Date.now(); save(); setBusy(false);
      if (c.messages.includes(am)) refreshMsg(am); else el.remove();
      if (!c.messages.length) renderChat();
      renderList();
    }
  })();
  return genPromise;
}
async function haltGen(){ if (ctrl) { ctrl.abort(); try { await genPromise; } catch(e){} } }

async function send(text){
  if (busy) return;
  const fromInput = text === undefined;
  text = (fromInput ? inp.value : text).trim();
  const att = fromInput ? pending : [];
  if (!text && !att.length) return;
  let c = curChat();
  if (!c) { c = { id:uid(), title:'Новый чат', created:Date.now(), updated:Date.now(), messages:[] }; S.chats.unshift(c); S.curId = c.id; }
  const um = { id:uid(), role:'user', content:text, t:Date.now() };
  if (att.length) um.att = att;
  c.messages.push(um); c.updated = Date.now();
  if (c.messages.filter(m => m.role === 'user').length === 1) c.title = (text || att[0].name).replace(/\s+/g, ' ').slice(0, 44);
  inp.value = ''; if (fromInput) { pending = []; renderPending(); } autosize();
  if (c.messages.length === 1) renderChat(); else { chatEl.appendChild(msgEl(um, true)); chatEl.scrollTop = chatEl.scrollHeight; }
  renderList(); save();
  generate(c);
}
async function regen(){
  const c = curChat(); if (!c || busy) return;
  while (c.messages.length && c.messages[c.messages.length - 1].role === 'assistant') c.messages.pop();
  if (!c.messages.length) return;
  renderChat(); generate(c);
}
function startEdit(id){
  if (busy) return;
  const c = curChat(); const m = c && c.messages.find(x => x.id === id); if (!m) return;
  const el = chatEl.querySelector('[data-id="' + id + '"] .col'); if (!el) return;
  el.innerHTML = '<textarea class="edit-ta"></textarea><div class="edit-b"><button class="btn" data-act="cancel-edit">Отмена</button><button class="btn p" data-act="save-edit">Отправить</button></div>';
  const ta = $('textarea', el); ta.value = m.content; ta.focus();
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 260) + 'px'; }; ta.oninput = fit; fit();
}
async function commitEdit(id, text){
  text = text.trim(); const c = curChat(); if (!c) return;
  await haltGen();
  const i = c.messages.findIndex(x => x.id === id); if (i < 0) return;
  const old = c.messages[i];
  if (!text && !(old.att && old.att.length)) return;
  c.messages = c.messages.slice(0, i);
  const nm = { id:uid(), role:'user', content:text, t:Date.now() }; if (old.att) nm.att = old.att;
  c.messages.push(nm);
  c.updated = Date.now(); save(); renderChat(); renderList(); generate(c);
}

/* ================= чаты: меню, экспорт ================= */
function chatToMd(c){
  let s = '# ' + c.title + '\n\n_Экспорт из Orbit AI · ' + new Date().toLocaleString('ru-RU') + '_\n\n';
  for (const m of c.messages) {
    const files = (m.att || []).map(a => '📎 ' + a.name).join('\n');
    s += '## ' + (m.role === 'user' ? 'Вы' : 'Orbit' + (m.model ? ' (' + m.model + ')' : '')) + '\n\n' + (files ? files + '\n\n' : '') + (m.content || '') + '\n\n';
  }
  return s;
}
async function downloadText(name, text){
  const blob = new Blob([text], { type:'text/markdown' });
  try {
    const file = new File([blob], name, { type:'text/markdown' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const safeName = t => (t || 'chat').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 40) || 'chat';
function openChatMenu(id){
  const c = S.chats.find(x => x.id === id); if (!c) return;
  openSheet((card, close) => {
    card.innerHTML = '<h3>' + esc(c.title) + '</h3><button class="cm" data-a="ren">' + ic('pencil') + 'Переименовать</button><button class="cm" data-a="exp">' + ic('down') + 'Экспорт в .md</button><button class="cm d" data-a="del">' + ic('trash') + 'Удалить</button>';
    card.onclick = async e => {
      const b = e.target.closest('[data-a]'); if (!b) return; close(null);
      if (b.dataset.a === 'ren') {
        const v = await dialog({ title:'Переименовать чат', input:true, value:c.title, ok:'Сохранить' });
        if (v) { c.title = v; save(); renderList(); }
      } else if (b.dataset.a === 'exp') downloadText(safeName(c.title) + '.md', chatToMd(c));
      else if (b.dataset.a === 'del') {
        const ok = await dialog({ title:'Удалить чат?', text:'Это действие нельзя отменить.', ok:'Удалить', danger:true });
        if (ok) { if (c.id === S.curId) await haltGen(); S.chats = S.chats.filter(x => x !== c); if (S.curId === c.id) S.curId = null; save(true); renderChat(); renderList(); }
      }
    };
  });
}

/* ================= вложения ================= */
let pending = [];
const MAX_FILE = 20 * 1024 * 1024, MAX_TEXT = 200000;
const FENCE = '`'.repeat(3);
const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|jsonl|xml|ya?ml|toml|ini|log|html?|css|scss|js|mjs|cjs|jsx|ts|tsx|py|rb|php|java|kt|swift|c|h|cpp|hpp|cs|go|rs|sql|sh|bash|bat|ps1|vue|svelte|env|conf|cfg)$/i;
const readAs = (file, how) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r[how](file); });
async function shrinkImage(file){
  const url = await readAs(file, 'readAsDataURL');
  if (file.type === 'image/gif') return url;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.85);
}
async function addFiles(list){
  for (const f of list) {
    if (pending.length >= 10) { toast('Не больше 10 вложений'); break; }
    if (f.size > MAX_FILE) { toast('Слишком большой файл: ' + f.name); continue; }
    try {
      if (/^image\//.test(f.type)) pending.push({ kind:'image', name:f.name || 'photo.jpg', data:await shrinkImage(f) });
      else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) pending.push({ kind:'pdf', name:f.name, data:await readAs(f, 'readAsDataURL') });
      else if (/^text\//.test(f.type) || f.type === 'application/json' || TEXT_EXT.test(f.name)) {
        let t = await readAs(f, 'readAsText');
        if (t.length > MAX_TEXT) { t = t.slice(0, MAX_TEXT); toast('Файл обрезан: ' + f.name); }
        pending.push({ kind:'text', name:f.name, data:t });
      } else toast('Тип файла не поддерживается: ' + f.name);
    } catch(e){ toast('Не удалось прочитать ' + f.name); }
  }
  renderPending();
}
function renderPending(){
  $('#atts').innerHTML = pending.map((a, i) => a.kind === 'image'
    ? '<div class="att img"><img src="' + a.data + '" alt=""><button class="x" data-rm="' + i + '" aria-label="Убрать">×</button></div>'
    : '<div class="att">' + ic('file') + '<span class="fn">' + esc(a.name) + '</span><button class="x" data-rm="' + i + '" aria-label="Убрать">×</button></div>').join('');
  autosize();
}
function pick(accept, camera){
  const f = document.createElement('input'); f.type = 'file'; f.style.display = 'none';
  if (accept) f.accept = accept;
  if (camera) f.setAttribute('capture', 'environment'); else f.multiple = true;
  document.body.appendChild(f);
  f.onchange = () => { addFiles([...f.files]); f.remove(); };
  f.click();
}
function openAttachMenu(){
  openSheet((card, close) => {
    card.innerHTML = '<h3>Добавить</h3>' +
      '<button class="cm" data-k="photo">' + ic('image') + 'Фото из галереи</button>' +
      '<button class="cm" data-k="cam">' + ic('camera') + 'Сделать фото</button>' +

      const k = b.dataset.k; close(null);
      if (k === 'photo') pick('image/*'); else if (k === 'cam') pick('image/*', true); else pick('');
    };

}
function toApi(m){
  if (m.role !== 'user' || !m.att || !m.att.length) return { role:m.role, content:m.content };
  let text = m.content || ''; const parts = [];
  for (const a of m.att) {
    if (a.kind === 'text') text += '\n\nФайл «' + a.name + '»:\n' + FENCE + '\n' + a.data + '\n' + FENCE;
    else if (a.kind === 'image') parts.push({ type:'image_url', image_url:{ url:a.data } });
    else if (a.kind === 'pdf') parts.push({ type:'file', file:{ filename:a.name, file_data:a.data } });
  }
  if (!parts.length) return { role:'user', content:text.trim() };
  return { role:'user', content:[{ type:'text', text:text.trim() || 'Посмотри вложение.' }, ...parts] };
}

$('#search').addEventListener('input', renderList);

$('#list').addEventListener('click', async e => {
  const it = e.target.closest('.it'); if (!it) return;
  const id = it.dataset.id, a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'menu') { openChatMenu(id); return; }
  if (S.curId !== id) await haltGen();
  S.curId = id; save(); renderChat(); renderList(); closeDrawer();
});

chatEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, c = curChat();
  if (act === 'sug') { send(b.textContent); return; }
  if (act === 'copycode') { const code = b.closest('.cb').querySelector('code'); copyText(code.textContent); return; }
  const msgDiv = b.closest('.msg'); const m = c && msgDiv && c.messages.find(x => x.id === msgDiv.dataset.id);
  if (act === 'copy' && m) copyText(m.content);
  else if (act === 'regen') regen();
  else if (act === 'edit' && m) startEdit(m.id);
  else if (act === 'cancel-edit') renderChat();
  else if (act === 'save-edit' && m) commitEdit(m.id, msgDiv.querySelector('textarea').value);
});

/* ================= запуск ================= */
(async function boot(){
  $('#menu').innerHTML = ic('menu'); $('#newbtn').innerHTML = ic('newc');
  $('#hlogo').innerHTML = logoSVG(true); $('#dlogo').innerHTML = logoSVG(true);
  $('#pill').insertAdjacentHTML('beforeend', ic('chev'));
  $('#d-new').innerHTML = ic('plus') + 'Новый чат';
  $('#sicon').innerHTML = ic('search');
  $('#d-models').innerHTML = ic('cpu') + 'Модели и ключи';
  $('#d-settings').innerHTML = ic('gear') + 'Настройки';
  $('#addb').innerHTML = ic('plus'); $('#addb').onclick = openAttachMenu;
  let loaded = null;
  try { const r = await idbGet(KEY); if (r) loaded = JSON.parse(r); } catch(e){}
  if (!loaded) { try { const r = localStorage.getItem(KEY); if (r) loaded = JSON.parse(r); } catch(e){} }
  if (loaded) S = Object.assign(defaults(), loaded);
  if (!S.models || !S.models.length) S.models = defaults().models;
  if (!S.models.find(m => m.id === S.activeModel)) S.activeModel = S.models[0].id;
  applyTheme(); renderAll();
  if (!S.models.some(m => m.key)) setTimeout(() => toast('Добавьте API ключ: нажмите на название модели вверху'), 900);
})();
})();
</script>
